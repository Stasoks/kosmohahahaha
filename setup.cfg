[metadata]
name = kosmohak-fuel-digital-twin
version = 0.2.0
description = Participant baseline digital twin over the official KosmoHackathon starter kit

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    jsonschema>=4.18
    PyYAML>=6.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7

