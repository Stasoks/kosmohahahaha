[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
markers = [
    "kernel: core engine and service-facade tests",
    "web: headless Streamlit UI tests (streamlit.testing.v1.AppTest)",
    "slow: slower end-to-end tests",
]
