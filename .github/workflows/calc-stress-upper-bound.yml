name: Calculate stress upper bound

on:
  push:
    branches:
      - calc-stress-upper-bound

permissions:
  contents: read

jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - run: python -m pytest -s tests/verification/test_exact_upper_bound_plan.py
