name: Generate final evidence pack

on:
  push:
    branches:
      - final-evidence-pack
    paths:
      - 'scripts/generate_final_evidence.py'
      - 'src/**'
      - 'data/**'
      - 'configs/**'
      - 'scenarios/**'
      - '.github/workflows/generate-final-evidence.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-evidence-pack
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Generate evidence
        run: python scripts/generate_final_evidence.py
      - name: Verify generated plans
        run: |
          python -m pytest tests/official tests/acceptance/test_strategy_builder.py tests/integration/test_scenarios.py tests/integration/test_sensitivity_reverse.py
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plans/final_base.json plans/final_stress_adaptation.json results/final-evidence
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate final competition evidence pack"
          git push origin HEAD:final-evidence-pack
