name: Verify Builder 97 Target

on:
  push:
    branches:
      - verify-builder-97

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - run: |
          python -m pytest -s tests/verification/test_builder_97_fast.py
